<!--
  La marque Clair, variante contenue — pour les emplacements qui interdisent le débordement.

  Certaines consoles de tiers exigent un fond coloré (ni blanc ni transparent) et une marge
  autour du contenu : ces deux règles interdisent exactement ce qui fait le caractère de la
  marque pleine, le fond papier et la lettre coupée par le cadre. Plutôt que de dénaturer celle-
  ci, on inverse : la lettre passe en clair sur le marine, et elle est contenue au lieu d'être
  recadrée. Ce qui identifie survit — le même serif, les mêmes deux bleus, le point carré dans
  l'ouverture du c.

  Marges mesurées sur le rendu à 512 px : 166 en haut, 166 en bas, 150 à gauche, 152 à droite,
  soit 29 % du côté au minimum. Le premier essai en laissait 193 en haut contre 139 en bas — la
  lettre pendait ; le centrage est optique, pas géométrique.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <rect width="64" height="64" fill="#1b3a63"/>
  <text x="17" y="42.6" font-family="Source Serif 4, Georgia, serif" font-weight="600" font-size="43" fill="#f3f5f7">c</text>
  <rect x="39" y="27.1" width="6" height="6" fill="#7fa6dc"/>
</svg>
